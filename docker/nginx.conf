events {}

http {
  upstream api {
    # o DNS do compose devolve todas as réplicas do serviço api
    server api:3000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
  }
}
